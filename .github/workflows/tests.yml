# Tests automatiques : à chaque envoi sur GitHub (toutes les branches, donc aussi les pull requests),
# les pages sont ouvertes dans un navigateur, sur ordinateur et sur téléphone.
# Deux parties : la maquette HTML (racine du dépôt) et le nouveau site Next.js (dossier site/).
# Résultat : ✅ ou ❌ à côté du commit et sur la pull request ; en cas d'échec, le rapport
# détaillé (captures d'écran comprises) est téléchargeable dans l'onglet « Actions ».
name: Tests automatiques

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pages, boutons et formulaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les outils de test
        run: npm ci

      - name: Installer le navigateur (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests (ordinateur + téléphone)
        run: npx playwright test

      - name: Garder le rapport de test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: playwright-report/
          retention-days: 14

  nouveau-site:
    name: Nouveau site (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Installer les outils
        run: npm ci

      - name: Vérifier le code
        run: npm run lint

      # Fausse base Supabase des tests (vraie base PGlite + annonces d'exemple), jamais la vraie :
      # lancée avant la construction, car l'accueil est préparé avec ses annonces. Elle reste allumée pour les tests.
      - name: Lancer la fausse base des tests
        run: |
          nohup node tests/base/serveur.mjs > base-tests.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:54329/ > /dev/null && exit 0; sleep 1; done
          cat base-tests.log; exit 1

      - name: Construire le site (vérifie aussi les types)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Adresse de la fausse base : pendant les tests, le site ne parle qu'à elle (et, dans le navigateur, à
          # site/tests/faux-supabase.ts), jamais à la vraie. Les vraies valeurs sont dans les réglages de Vercel.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54329
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_tests

      - name: Installer le navigateur (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests (ordinateur + téléphone)
        run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Garder le rapport de test
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapport-nouveau-site
          path: site/playwright-report/
          retention-days: 14
